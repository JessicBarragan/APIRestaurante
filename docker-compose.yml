
services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bd_restaurante
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_restaurante"]
      interval: 5s
      timeout: 5s
      retries: 10

  servicio_autenticacion:
    build:
      context: ./servicio_autenticacion
    ports:
      - "4004:8000"
    volumes:
      # Las llaves RSA viven en la raíz del proyecto; se montan dentro
      # del contenedor (solo lectura) en vez de copiarlas a la imagen.
      - ./private_key.pem:/app/private_key.pem:ro
      - ./public_key.pem:/app/public_key.pem:ro
    depends_on:
      db:
        condition: service_healthy

  servicio_clientes_productos:
    build:
      context: ./servicio_clientes_productos
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  servicio_pagos_domicilios:
    build:
      context: ./servicio_pagos_domicilios
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - servicio_autenticacion
      - servicio_clientes_productos
      - servicio_pagos_domicilios

volumes:
  postgres_data:
